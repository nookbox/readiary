# 워크스페이스가 아니라 pnpm 설정 파일로 쓴다 (pnpm 11부터 package.json 의 pnpm 필드는 무시됨).
# drizzle-kit 이 esbuild 바이너리를, vitest(unplugin-swc) 가 @swc/core 바이너리를 필요로 한다.
# @scarf/scarf(텔레메트리)와 testcontainers 의 선택적 네이티브 빌드(ssh2, cpu-features, protobufjs)는 차단.
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
