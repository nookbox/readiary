info:
  name: 03 authorize
  type: http
  seq: 3

http:
  method: GET
  url: "{{authorizeUrl}}"

# Bruno 는 Accept: application/json 을 보내서 IdP 가 302 대신 {"redirect":true,"url":...} 로 답한다.
# 정상이면 url 이 localhost:4000/api/auth/callback/nook-auth?code=... 이다.
# localhost:3000/signin 이 나오면 01 로그인이 실패한 것.
runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.url
        method: jsonq
      variable:
        name: callbackUrl
        scope: runtime

settings:
  # authorizeUrl 은 이미 인코딩돼 있다. 다시 인코딩하면 redirect_uri 가 깨진다.
  encodeUrl: false
  followRedirects: false
