info:
  name: 02 readiary 로그인 시작
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/sign-in/social"
  headers:
    - name: Origin
      value: http://localhost:4000
  body:
    type: json
    data: |-
      {
        "provider": "nook-auth",
        "callbackURL": "http://localhost:4000/api/health",
        "disableRedirect": true
      }

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.url
        method: jsonq
      variable:
        name: authorizeUrl
        scope: runtime
