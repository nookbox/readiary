services:
  postgres:
    image: postgres:16-alpine
    container_name: readiary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: readiary
      POSTGRES_PASSWORD: readiary
      POSTGRES_DB: readiary
      TZ: Asia/Seoul
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U readiary -d readiary']
      interval: 10s
      timeout: 5s
      retries: 5
